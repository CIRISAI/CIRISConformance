# The coherent set under test. CI installs exactly this set into a clean
# venv before running pytest. Adjust ONLY when the cohabitation contract is
# consciously updated — this file is the canonical statement of "what's
# expected to work together right now."
#
# ─── Two channels, because the family ships two ways ──────────────────
#
# `stack` members are on PyPI and install as `name==version`.
# `substrate` members are NOT on PyPI at head and install from a git tag,
# which means pip builds them from source (maturin + cargo).
#
# This split is not a preference — it is where the family actually ships:
#
#   - ciris-persist last published a desktop wheel at 22.0.1 (2026-07-30);
#     git is at v33.0.0. ciris-edge last published 15.0.0 (2026-07-28);
#     git is at v17.5.0. Their release assets are android / iOS / xcframework
#     only. Both keep a root maturin `pyproject.toml`, so a git tag is a
#     complete Python install source.
#   - ciris-verify IS still published (13.3.1, 2026-08-15) and must stay a
#     PyPI pin: CIRISVerify's Python project lives at `bindings/python`, not
#     the repo root, so a `git+…/CIRISVerify` install fails "does not appear
#     to be a Python project". The Rust crate tag is also NOT the Python
#     package version. CIRISEdge's CI learned this on its v16.0.1 tag run.
#   - ciris-server is the node wheel and stays on PyPI.
#
# CIRISEdge's `extract-substrate-pins` job already emits persist as a git
# ref into our `pin-overrides` input, so this file is catching up to a shape
# its consumers adopted first.
#
# Update protocol:
#   1. Read the coherent set off CIRISServer `main`'s Cargo.toml — it is the
#      integrator and its tags ARE the contract. Bump `stack` + `substrate`
#      together; a set is coherent or it is nothing.
#   2. Run `pytest` locally to verify; remove any `xfail` that now passes.
#   3. Record WHY in `rationale` below — one paragraph, not a changelog.
#      Prior cycles live in `matrices/history/pin-changelog.md`.
#   4. PR; the under-test consumer repos see the new floor on their next merge.
#
# Crates not yet shipping a Python surface (nodecore / lenscore / registry-core)
# are omitted; add them when they cut one.

# ─── PyPI members ─────────────────────────────────────────────────────
# NOTE: ciris-keyring + ciris-crypto are Rust-only crates inside CIRISVerify;
# they have NO Python wheels — they ride statically inside ciris-verify and
# ciris-edge's compiled cdylib via Cargo. ciris-verify is the Python surface
# that wraps them.
stack:
  ciris-server: "0.5.244"
  ciris-verify: "22.0.0"

# ─── git-tag members ──────────────────────────────────────────────────
# pip builds these from source, so a CI cell pays a cargo compile for each —
# that cost is the price of the substrate leaving PyPI, not a harness choice.
#
# BOTH `tag` and `sha` are required, and they carry different jobs:
#
#   - `tag` is what a human reads and what CIRISServer's Cargo.toml states.
#   - `sha` is what is actually INSTALLED. pip only reuses a cached wheel for a
#     VCS requirement when the ref is immutable; a tag is not (it can be moved),
#     so pinning the tag would recompile the substrate in every cell of every
#     run. These are annotated tags — the sha is the DEREFERENCED commit
#     (`git ls-remote <repo> refs/tags/<tag>^{}`), not the tag object's own id.
#
# Two strings that can disagree is exactly the failure mode this repo keeps
# filing against other people's build systems, so it is checked rather than
# trusted: `python tools/install_pins.py --verify-refs` resolves each tag
# upstream and fails if it does not match the recorded sha. CI runs it.
substrate:
  ciris-persist:
    repo: "https://github.com/CIRISAI/CIRISPersist"
    tag: "v61.0.5"
    sha: "048f0993eccbbb81813de9a726b43472b47d9e06"
  ciris-edge:
    repo: "https://github.com/CIRISAI/CIRISEdge"
    tag: "v44.1.0"
    sha: "07eac79c2ac398715b6684b800f5237141cb4e36"

# ─── Normative members ────────────────────────────────────────────────
# FSD #86 §4 Class 3: a set that pins the code but not the Constitution
# commit is not describing a coherent system, it is describing the part that
# happened to be installable. Promoted here from prose in the pin comments.
constitution:
  # rc17 is not tagged yet: this is the rc17 branch head at vendoring time
  # (tools/vendor_constitution.py). Re-vendor and re-pin at the v1.0-rc17 tag.
  version: "1.0-rc17"
  repo: "https://github.com/CIRISAI/CIRISConstitution"
  commit: "892a68b"

# ─── Why this set ─────────────────────────────────────────────────────
# One paragraph per member for the CURRENT pin. History: matrices/history/.
rationale:
  set: >-
    The CIRISServer 0.5.245 line: persist v61.0.5, edge v44.1.0, verify 22.0.0.
    0.5.245 is not on PyPI yet, so the stack keeps the newest PUBLISHED server
    (0.5.244); a server PR supplies its own wheel as under-test. Moved from
    edge v44.0.0 / persist v61.0.4 because a set that lags the server under
    test mixes two edge and persist builds in one process (a cdylib
    duplication that SIGSEGVs on postgres; CIRISServer PR #866). Bump server
    to 0.5.245 when it publishes. The suite's contract changes for persist v61
    and edge v44 are PR #106, each citing its persist issue and CC section.
  ciris-server: >-
    0.5.222 → 0.5.244, the newest on PyPI (0.5.245, the persist v61 / edge
    44.1 adopt, is unpublished).
  ciris-verify: >-
    19.0.0 → 22.0.0, the verify CIRISServer 0.5.245 carries.
  ciris-persist: >-
    v61.0.4 → v61.0.5 (048f0993), the persist CIRISServer 0.5.245 carries
    (adds the by-subject read door edge v44.1.0 calls).
  ciris-edge: >-
    v44.0.0 → v44.1.0 (07eac79c), the edge CIRISServer 0.5.245 pins.
# Python interpreter version under test. Every member declares
# `requires-python = ">=3.10"`; the abi3-py310 build (one wheel for all
# 3.10+) is the canonical shape. We exercise the floor (3.10) + a current
# minor (3.12) — covering the abi3 forward-compat promise without spending
# CI cycles on every minor in between.
python_versions:
  - "3.10"
  - "3.12"

# Known cross-artifact issues this matrix EXPECTS to fail. The
# corresponding tests carry @pytest.mark.xfail(strict=True). When an
# issue closes, remove from this list AND remove the xfail marker —
# strict=True will then flag any silent regression.
known_failures:
  - id: "CIRISPersist#990"
    url: "https://github.com/CIRISAI/CIRISPersist/issues/990"
    title: >-
      On the FAMILY widening plane (persist v49+) an exact UNSIGNED re-add of
      an already-active member is still refused
      `federation_federation_tier_unverified`. #936 (v51.2.0) restored the
      idempotent no-op on the community arm only; the family twin skips the
      fold short-circuit the same way. A signed exact retry returns False.
    affects:
      - tests/test_260_cohort_member_lifecycle.py::test_unsigned_exact_readd_is_a_noop
  # CLOSED — CIRISPersist#936 (persist v51.2.0 restored the exact unsigned re-add
  # as the idempotent no-op on the widening plane; test_263's strict xfail came off).
  # CLOSED — CIRISPersist#811 (persist v42.0.0 narrowed `is_steward_bound` to the
  # owner-binding predicate; test_361's strict xfail XPASSed on the first run
  # against it and came off — CIRISConformance#98).
  # CLOSED — CIRISConformance#87 (the trust-root conferral fixture). The harness
  # now performs the real three-row ceremony (charter / accept / confer, see
  # conftest.TRUST_ROOT_CEREMONY_SRC), so every witness-reserved and detector
  # emit is drivable; the fourteen markers and the imperative guard are gone.
