# The coherent set under test. CI installs exactly this set into a clean
# venv before running pytest. Adjust ONLY when the cohabitation contract is
# consciously updated — this file is the canonical statement of "what's
# expected to work together right now."
#
# ─── Two channels, because the family ships two ways ──────────────────
#
# `stack` members are on PyPI and install as `name==version`.
# `substrate` members are NOT on PyPI at head and install from a git tag,
# which means pip builds them from source (maturin + cargo).
#
# This split is not a preference — it is where the family actually ships:
#
#   - ciris-persist last published a desktop wheel at 22.0.1 (2026-07-30);
#     git is at v33.0.0. ciris-edge last published 15.0.0 (2026-07-28);
#     git is at v17.5.0. Their release assets are android / iOS / xcframework
#     only. Both keep a root maturin `pyproject.toml`, so a git tag is a
#     complete Python install source.
#   - ciris-verify IS still published (13.3.1, 2026-08-15) and must stay a
#     PyPI pin: CIRISVerify's Python project lives at `bindings/python`, not
#     the repo root, so a `git+…/CIRISVerify` install fails "does not appear
#     to be a Python project". The Rust crate tag is also NOT the Python
#     package version. CIRISEdge's CI learned this on its v16.0.1 tag run.
#   - ciris-server is the node wheel and stays on PyPI.
#
# CIRISEdge's `extract-substrate-pins` job already emits persist as a git
# ref into our `pin-overrides` input, so this file is catching up to a shape
# its consumers adopted first.
#
# Update protocol:
#   1. Read the coherent set off CIRISServer `main`'s Cargo.toml — it is the
#      integrator and its tags ARE the contract. Bump `stack` + `substrate`
#      together; a set is coherent or it is nothing.
#   2. Run `pytest` locally to verify; remove any `xfail` that now passes.
#   3. Record WHY in `rationale` below — one paragraph, not a changelog.
#      Prior cycles live in `matrices/history/pin-changelog.md`.
#   4. PR; the under-test consumer repos see the new floor on their next merge.
#
# Crates not yet shipping a Python surface (nodecore / lenscore / registry-core)
# are omitted; add them when they cut one.

# ─── PyPI members ─────────────────────────────────────────────────────
# NOTE: ciris-keyring + ciris-crypto are Rust-only crates inside CIRISVerify;
# they have NO Python wheels — they ride statically inside ciris-verify and
# ciris-edge's compiled cdylib via Cargo. ciris-verify is the Python surface
# that wraps them.
stack:
  ciris-server: "0.5.176"
  ciris-verify: "13.3.1"

# ─── git-tag members ──────────────────────────────────────────────────
# pip builds these from source, so a CI cell pays a cargo compile for each —
# that cost is the price of the substrate leaving PyPI, not a harness choice.
#
# BOTH `tag` and `sha` are required, and they carry different jobs:
#
#   - `tag` is what a human reads and what CIRISServer's Cargo.toml states.
#   - `sha` is what is actually INSTALLED. pip only reuses a cached wheel for a
#     VCS requirement when the ref is immutable; a tag is not (it can be moved),
#     so pinning the tag would recompile the substrate in every cell of every
#     run. These are annotated tags — the sha is the DEREFERENCED commit
#     (`git ls-remote <repo> refs/tags/<tag>^{}`), not the tag object's own id.
#
# Two strings that can disagree is exactly the failure mode this repo keeps
# filing against other people's build systems, so it is checked rather than
# trusted: `python tools/install_pins.py --verify-refs` resolves each tag
# upstream and fails if it does not match the recorded sha. CI runs it.
substrate:
  ciris-persist:
    repo: "https://github.com/CIRISAI/CIRISPersist"
    tag: "v32.3.0"
    sha: "5d1cd36e3d9fd8131cfc38ff4b023667a8d42b6d"
  ciris-edge:
    repo: "https://github.com/CIRISAI/CIRISEdge"
    tag: "v17.4.1"
    sha: "abee3686e2ee5f52282619f5fbce7771d126544a"

# ─── Normative members ────────────────────────────────────────────────
# FSD #86 §4 Class 3: a set that pins the code but not the Constitution
# commit is not describing a coherent system, it is describing the part that
# happened to be installable. Promoted here from prose in the pin comments.
constitution:
  version: "1.0-rc2"
  repo: "https://github.com/CIRISAI/CIRISConstitution"
  commit: "5818a75"

# ─── Why this set ─────────────────────────────────────────────────────
# One paragraph per member for the CURRENT pin. History: matrices/history/.
rationale:
  set: >-
    Catch-up to the rolling head after a ~4-week, ~45-release drift (FSD #86
    §1.2 measured it: main pinned ciris-server 0.5.131 of 2026-07-20 while
    CIRISServer main was 0.5.176 of 2026-08-16). The set is read off
    CIRISServer main's Cargo.toml, which is the integrator's own statement of
    what cohabits: persist v32.3.0, edge v17.4.1, verify v13.3.1. This bump
    also changes the SHAPE of the matrix, not just its numbers — persist and
    edge left PyPI mid-drift, so they move to the git-tag channel above.
  ciris-server: >-
    0.5.131 → 0.5.176. Head of the integrator. 0.5.176 is the hosted-login
    un-break (#421). The old footgun this pin used to hit is now structural
    rather than incidental: ciris-server's PyPI index retains only ~5
    releases, so this pin still rots fastest — when all edge cohab cells fail
    uniformly at pip-install with "No matching distribution for
    ciris-server==X", bump this line first.
  ciris-verify: >-
    10.5.0 → 13.3.1. MAJOR 10→13. The only substrate member still on PyPI,
    and its published version matches the server's Cargo tag exactly
    (v13.3.1), so the wheel and the compiled-in crate are the same code for
    the first time in several cycles.
  ciris-persist: >-
    17.8.0 → v32.3.0. FIFTEEN majors. Moves to the git-tag channel. Three
    drifts the harness absorbed: `cohort_add_member`/`cohort_swap_member`
    gained a required `admit_spec_json` (CIRISPersist#654 — roster growth was
    reachable from PyO3 with NO authority check, and the roster is both
    numerator and denominator of the family quorum); `attestation_promote`
    gained `cohort_scope` (#519 — a promotion now carries its placement, and
    #589/AV-45 refuses a third-party-naming row at `family`/`community`); and
    the v2 key-grant wrap token was respelled to underscores while v1 kept
    hyphens (reported as CIRISPersist#715).
  ciris-edge: >-
    13.8.0 → v17.4.1. MAJOR 13→17. Moves to the git-tag channel. Note this is
    the tag CIRISServer pins, NOT edge's repo head (v17.5.0) — the set is
    what the integrator carries, and a member ahead of the integrator is not
    yet in the coherent set. Behavioural drift: the Reticulum transport now
    REQUIRES a hybrid federation signer (CIRISEdge#458 / #393 item 2) — an
    Ed25519-only node cannot mint the hybrid-signed SignedTransportDestination,
    so peers would drop its frames unattributed at the E3 gate. Edge refuses
    the boot rather than letting that surface as silence on the wire.

# Python interpreter version under test. Every member declares
# `requires-python = ">=3.10"`; the abi3-py310 build (one wheel for all
# 3.10+) is the canonical shape. We exercise the floor (3.10) + a current
# minor (3.12) — covering the abi3 forward-compat promise without spending
# CI cycles on every minor in between.
python_versions:
  - "3.10"
  - "3.12"

# Known cross-artifact issues this matrix EXPECTS to fail. The
# corresponding tests carry @pytest.mark.xfail(strict=True). When an
# issue closes, remove from this list AND remove the xfail marker —
# strict=True will then flag any silent regression.
known_failures:
  - id: "CIRISConformance#87"
    url: "https://github.com/CIRISAI/CIRISConformance/issues/87"
    title: >-
      The witness-reserved prefixes (`age_assurance:`, `capacity_assurance:`)
      gained a `required_delegation_scope` of `infra:attest_assurance`, and the
      check is not a delegation the emitter can arrange for itself: persist's
      `check_reserved_prefix_admission` needs `set_node_key_id()` AND the
      capability conferred to the attesting key from a trust root THIS NODE
      trusts. The harness has no trust-root ceremony, so every witness emit is
      refused with `federation_reserved_prefix_emitter_mismatch`. Closing it is
      new fixture infrastructure (a genesis root + conferral), not a pin bump.
    affects:
      - tests/test_350_age_assurance_reservation.py::test_witness_key_admitted_on_age_assurance
      - tests/test_351_age_band_ratchet.py::test_witness_assurance_outranks_self
      - tests/test_351_age_band_ratchet.py::test_cross_subject_witness_graduation
      - tests/test_351_age_band_ratchet.py::test_fine_band_witness_graduation
      - tests/test_360_steward_binding_admission.py::test_node_steward_binding_is_admitted_and_resolves
      - tests/test_360_steward_binding_admission.py::test_witness_attestation_graduates_age_bands
      - tests/test_360_steward_binding_admission.py::test_adult_target_user_binding_is_rejected
      - tests/test_360_steward_binding_admission.py::test_adult_target_steward_bind_is_rejected
      - tests/test_360_steward_binding_admission.py::test_unverified_age_target_is_rejected
      - tests/test_360_steward_binding_admission.py::test_minor_target_user_binding_is_admitted_only_because_minor
      - tests/test_550_detection_discriminator.py::test_lenscore_detector_key_admitted_on_detection
      - tests/test_572_capacity_incapacity_gate.py::test_capacity_graduates_per_domain_and_presumes_capacity
      - tests/test_573_co_stewardship.py::test_steward_bindings_resolve_to_both_stewards
      - tests/test_573_co_stewardship.py::test_node_never_orphaned_while_one_steward_remains
    # test_361's three cases fail in a module fixture rather than the call
    # phase, so a marker cannot reach them — pytest reports a fixture failure as
    # an error, not an xfail. They use conftest's
    # `xfail_if_unconferred_assurance_scope`, the same imperative shape as the
    # pre-existing postgres edge-runtime crash guard.
