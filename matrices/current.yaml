# The coherent set under test. CI installs exactly this set into a clean
# venv before running pytest. Adjust ONLY when the cohabitation contract is
# consciously updated — this file is the canonical statement of "what's
# expected to work together right now."
#
# ─── Two channels, because the family ships two ways ──────────────────
#
# `stack` members are on PyPI and install as `name==version`.
# `substrate` members are NOT on PyPI at head and install from a git tag,
# which means pip builds them from source (maturin + cargo).
#
# This split is not a preference — it is where the family actually ships:
#
#   - ciris-persist last published a desktop wheel at 22.0.1 (2026-07-30);
#     git is at v33.0.0. ciris-edge last published 15.0.0 (2026-07-28);
#     git is at v17.5.0. Their release assets are android / iOS / xcframework
#     only. Both keep a root maturin `pyproject.toml`, so a git tag is a
#     complete Python install source.
#   - ciris-verify IS still published (13.3.1, 2026-08-15) and must stay a
#     PyPI pin: CIRISVerify's Python project lives at `bindings/python`, not
#     the repo root, so a `git+…/CIRISVerify` install fails "does not appear
#     to be a Python project". The Rust crate tag is also NOT the Python
#     package version. CIRISEdge's CI learned this on its v16.0.1 tag run.
#   - ciris-server is the node wheel and stays on PyPI.
#
# CIRISEdge's `extract-substrate-pins` job already emits persist as a git
# ref into our `pin-overrides` input, so this file is catching up to a shape
# its consumers adopted first.
#
# Update protocol:
#   1. Read the coherent set off CIRISServer `main`'s Cargo.toml — it is the
#      integrator and its tags ARE the contract. Bump `stack` + `substrate`
#      together; a set is coherent or it is nothing.
#   2. Run `pytest` locally to verify; remove any `xfail` that now passes.
#   3. Record WHY in `rationale` below — one paragraph, not a changelog.
#      Prior cycles live in `matrices/history/pin-changelog.md`.
#   4. PR; the under-test consumer repos see the new floor on their next merge.
#
# Crates not yet shipping a Python surface (nodecore / lenscore / registry-core)
# are omitted; add them when they cut one.

# ─── PyPI members ─────────────────────────────────────────────────────
# NOTE: ciris-keyring + ciris-crypto are Rust-only crates inside CIRISVerify;
# they have NO Python wheels — they ride statically inside ciris-verify and
# ciris-edge's compiled cdylib via Cargo. ciris-verify is the Python surface
# that wraps them.
stack:
  ciris-server: "0.5.197"
  ciris-verify: "14.1.0"

# ─── git-tag members ──────────────────────────────────────────────────
# pip builds these from source, so a CI cell pays a cargo compile for each —
# that cost is the price of the substrate leaving PyPI, not a harness choice.
#
# BOTH `tag` and `sha` are required, and they carry different jobs:
#
#   - `tag` is what a human reads and what CIRISServer's Cargo.toml states.
#   - `sha` is what is actually INSTALLED. pip only reuses a cached wheel for a
#     VCS requirement when the ref is immutable; a tag is not (it can be moved),
#     so pinning the tag would recompile the substrate in every cell of every
#     run. These are annotated tags — the sha is the DEREFERENCED commit
#     (`git ls-remote <repo> refs/tags/<tag>^{}`), not the tag object's own id.
#
# Two strings that can disagree is exactly the failure mode this repo keeps
# filing against other people's build systems, so it is checked rather than
# trusted: `python tools/install_pins.py --verify-refs` resolves each tag
# upstream and fails if it does not match the recorded sha. CI runs it.
substrate:
  ciris-persist:
    repo: "https://github.com/CIRISAI/CIRISPersist"
    tag: "v40.0.0"
    sha: "b7f1a550b42669fd74f8059e6ca7a27bcecc47ae"
  ciris-edge:
    repo: "https://github.com/CIRISAI/CIRISEdge"
    tag: "v20.1.1"
    sha: "f7050ceed0673b24e0128506b0e8daa517bdf290"

# ─── Normative members ────────────────────────────────────────────────
# FSD #86 §4 Class 3: a set that pins the code but not the Constitution
# commit is not describing a coherent system, it is describing the part that
# happened to be installable. Promoted here from prose in the pin comments.
constitution:
  version: "1.0-rc2"
  repo: "https://github.com/CIRISAI/CIRISConstitution"
  commit: "5818a75"

# ─── Why this set ─────────────────────────────────────────────────────
# One paragraph per member for the CURRENT pin. History: matrices/history/.
rationale:
  set: >-
    Retention bump. `ciris-server==0.5.176` aged off PyPI (the index retains
    only ~5 releases; 0.5.187 is now the oldest available), so every cell
    failed at pip-install and ALL SIX of CIRISEdge's cohabitation cells went
    red on its v20.2.0 tag run — the recurring footgun the previous
    `ciris-server` note names, hit again on schedule. The set is read off
    CIRISServer v0.5.197's own Cargo.toml, which is the integrator's statement
    of what cohabits: persist v40.0.0, edge v20.1.1, verify v14.1.0. Every
    substrate sha below is the DEREFERENCED tag, resolved upstream at bump
    time rather than copied.
  ciris-server: >-
    0.5.176 → 0.5.197. Head of the integrator and the newest version still on
    the index. This is the wheel that reported CIRISEdge#568 (the announce
    race) and CIRISPersist#804 (origin-aware write budgets) from a live
    two-node ladder, so it is a set that has actually been run rather than
    only resolved. The retention footgun is unchanged: when all edge cohab
    cells fail uniformly at pip-install with "No matching distribution for
    ciris-server==X", bump this line first.
  ciris-verify: >-
    13.3.1 → 14.1.0. MAJOR 13→14. Still the only stack member on PyPI, and
    the published wheel again matches the server's Cargo tag exactly
    (v14.1.0), so wheel and compiled-in crate stay the same code. Note edge
    has since moved to verify v14.2.0 (additive — `fedcode` gains
    `verify_pulled_ml_dsa_65_pubkey`); the set holds at the integrator's
    v14.1.0, because a member ahead of the integrator is not yet in it.
  ciris-persist: >-
    v32.3.0 → v40.0.0. EIGHT majors, and the largest single jump this matrix
    has taken. The arc worth knowing: v39.0.0 retired `attestation_promote`
    for the two-verb `enter_mesh` + `widen_audience` (the actor's signature
    survives a tier crossing instead of being replaced by the node's), and
    v40.0.0 made a widening carry the CLAIM's `asserted_at` verbatim with the
    placement's own instant moving to a signed `widened_at`. Both are wire
    breaks the suite drives directly, and the harness absorbed them: test_574
    / test_576 / test_579 now drive `describe_crossing` → `enter_mesh` →
    `widen_audience` (typed `crossed` / `already_in_mesh` / `already_widened`
    outcomes stand in for the old True→False flip; test_574 additionally
    asserts the widening carries the prior's `asserted_at` verbatim plus a
    signed `widened_at`). Also absorbed on the way: v34/v35 removed the
    classical DEK wrap (test_250 now asserts the minter is GONE and that the
    retired spellings are refused BY NAME at the decode door, against a
    wrong-key control); v36 typed `retire_key_grants` as
    `{outcome, retired[, failed]}` (test_130); and at v40 an `accord:*` emit
    from a key naming no accord root is refused by the trust-root gate
    (`federation_accord_root_unnamed`) before role membership is consulted,
    so test_580's unheld-role probe moved to `detection:*` /
    `lenscore_detector` to keep hitting the set-membership gate it is about.
  ciris-edge: >-
    v17.4.1 → v20.1.1. MAJOR 17→20. The tag CIRISServer pins, not edge's head
    (v20.2.1) — the set is what the integrator carries. Chat is end-to-end
    encrypted from v19.0.0 (sealed under the pair room's MLS record secret)
    and every signature is now the full hybrid with no classical-only
    fallback, so a fixture signing Ed25519-only is refused at source rather
    than admitted and dropped later. Harness impact: every probe engine now
    carries its ML-DSA-65 half (test_140, test_230, test_520); the
    `ed25519_fallback` pairing those probes documented is gone with the
    fallback. Edge's OWN pyo3 conformance helper was not moved with it —
    `build_signed_inbound_envelope` still builds an Ed25519-only signer and
    refuses on its own wheel (CIRISEdge#573), so test_230 and test_520's
    accept probe carry an imperative xfail keyed on that exact signer token
    until it lands. The `WIRE_VOCABULARY.md` this set's edge speaks is the
    CC 1.0-rc4 manifest (26 Tier-1 variants; `EphemeralResponse` joined in
    CC 0.7 §2.9), re-vendored under reference/ in the same bump because
    test_520 derives its wheel expectation from it.

# Python interpreter version under test. Every member declares
# `requires-python = ">=3.10"`; the abi3-py310 build (one wheel for all
# 3.10+) is the canonical shape. We exercise the floor (3.10) + a current
# minor (3.12) — covering the abi3 forward-compat promise without spending
# CI cycles on every minor in between.
python_versions:
  - "3.10"
  - "3.12"

# Known cross-artifact issues this matrix EXPECTS to fail. The
# corresponding tests carry @pytest.mark.xfail(strict=True). When an
# issue closes, remove from this list AND remove the xfail marker —
# strict=True will then flag any silent regression.
known_failures:
  - id: "CIRISEdge#573"
    url: "https://github.com/CIRISAI/CIRISEdge/issues/573"
    title: >-
      Edge's own pyo3 conformance helper `build_signed_inbound_envelope` still
      builds an Ed25519-only software signer, but every signature is the FULL
      hybrid since edge v19.0.0 — the helper refuses at `sign_envelope` on the
      wheel that ships it, so the inbound path is undrivable from Python. Fix
      shape filed: accept a `pqc_seed_bytes` (mirroring
      `tests/trust_short_circuit.rs::FedKey::pqc_signer`) or sign with the
      runtime's own `extract_local_signer(engine)`.
    affects:
      - tests/test_230_intake_gate.py::test_verified_inbound_is_received
      - tests/test_230_intake_gate.py::test_low_trust_source_is_short_circuited
      - tests/test_230_intake_gate.py::test_threshold_zero_readmits
      - tests/test_520_wire_vocabulary.py::test_tier1_and_opaque_variants_accepted
    # These fail inside the probe (fixture / accept map), so they carry
    # conftest's imperative `xfail_if_helper_cannot_sign_hybrid`, keyed on the
    # exact `has no ML-DSA-65 (PQC) half` signer token — any other refusal still
    # fails loudly, and they resume with nothing to remove.
  - id: "CIRISPersist#811"
    url: "https://github.com/CIRISAI/CIRISPersist/issues/811"
    title: >-
      `is_steward_bound` still counts a plain capability conferral after the
      sole owner-binding is revoked — the predicate did not narrow with the
      `steward_bindings_of` fold (CIRISConstitution#87 "conferral is not
      stewardship" pairs them; persist documents the biconditional). A node
      whose only custody edge is withdrawn reads steward-bound to nobody.
    affects:
      - tests/test_361_minor_stewardship_liveness.py::test_conferral_does_not_keep_a_node_steward_bound_predicate
  # CLOSED — CIRISConformance#87 (the trust-root conferral fixture). The harness
  # now performs the real three-row ceremony (charter / accept / confer, see
  # conftest.TRUST_ROOT_CEREMONY_SRC), so every witness-reserved and detector
  # emit is drivable; the fourteen markers and the imperative guard are gone.
