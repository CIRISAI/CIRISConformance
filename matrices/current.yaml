# Pinned wheel matrix under test. CI installs exactly these versions
# into a clean venv before running pytest. Adjust ONLY when the
# cohabitation contract is consciously updated — these pins are the
# canonical statement of "what's expected to work together right now."
#
# Update protocol:
#   1. Bump the relevant pin (e.g. ciris-edge: 0.9.2 after persist#109 lands)
#   2. Run `pytest` locally to verify; remove any `xfail` that now passes
#   3. PR; the under-test consumer repos see the new floor on their next merge
#
# Crates not yet shipping wheels (nodecore / lenscore / registry-core) are
# omitted; add them here when they cut their first PyPI release.

stack:
  # CIRIS family Python wheels on PyPI.
  # NOTE: ciris-keyring + ciris-crypto are Rust-only crates inside
  # CIRISVerify; they have NO Python wheels — they ride statically
  # inside ciris-verify + ciris-edge's compiled cdylib via Cargo.
  # ciris-verify is the Python surface that wraps them.
  ciris-persist: "4.14.0"  # bumped 4.13.0 → 4.14.0 — Self/family at-rest DEK cascade (CIRISPersist#152 / CEG 0.18 §10.1.4): the InvisibleEncrypted tier ships. V070 migration adds federation_blob_key_grants (per-(at_rest_sha256, recipient_key_id) wrapped DEK rows — substrate state, never a wire attestation) + federation_content_master (software content-master single-row table). New federation::at_rest_cascade module with the at-rest ciphertext envelope (magic ‖ nonce ‖ aes-gcm), per-write DEK seal/open, persist content-master self-retention wrap, v2 recipient wrap (via ciris_crypto::key_grant), and the encrypt_and_cascade / read_for_viewer orchestration. New Engine::put_blob_encrypted_self_family / get_blob_for_viewer surfaces. Fail-secure excludes any recipient without registered encryption_pubkeys (§10.1.4 — never a plaintext / v1 fallback). Content-master is SOFTWARE today (honest about being software; hardware-rooted TPM/Keystore/Secure-Enclave derivation per ENCRYPTED_AT_REST.md §4.3 is the production target, deferred to a follow-up). CommunityDek tier + membership-change watcher (#161 Asks 4-5 / #183) DEFERRED. Edge consumes additively — the substrate is blob-storage layer; replication's signed-record wire shape unchanged. v1 wire taxonomy intact at 10 variants. Prior chain anchored at v4.10/v4.12/v4.13 preserved.
  ciris-verify:  "5.0.0"   # bumped 4.11.0 → 5.0.0 — CEG 1.0 / Agent 3.0 substrate release. Held at 4.11.0 through v1.4.x while persist 4.8/4.9 pyproject kept `ciris-verify<5`; persist v4.10.0 fixes that ceiling, so the matrix finally moves to 5.0.0 (the Rust-side substrate has been on v5 since persist v4.6.1 — see Cargo cohabitation contract). #58 key_grant v2 (X25519+ML-KEM-768) + #54 hybrid-signed doc_integrity + #55 RNG SP 800-90B startup health-check + #59 JCS verify + #60 boundary_degraded + #61 jcs_canonicalize Py binding + #31 CEG 0.11 infrastructure_community. Major bump structurally: internal keyring → crypto Cargo constraint moved version="4" → "5"; downstream consumers (persist v4.6.1+, edge v1.4.0+) flip both git tag + version constraint.
  ciris-edge:    "1.6.1"  # bumped 1.6.0 → 1.6.1 — pure pin-currency patch consuming persist v4.13.0 → v4.14.0 (Self/family at-rest DEK cascade — InvisibleEncrypted tier). Zero source-code changes on edge's side; v1 wire taxonomy intact at 10 variants. The persist surface edge gains visibility into is at the blob-storage layer (federation_blob_key_grants substrate table + Engine::put_blob_encrypted_self_family / get_blob_for_viewer methods); replication's signed-record wire shape is unaffected — DEK-encrypted content rides content-fetch out-of-band per FSD §7.1's directory/content split. The bridge's apply_envelope_bytes still routes to persist's signed-record put_* surfaces unchanged. Prior v1.6.0 history preserved: MINOR cut shipping CIRISEdge#65 layer (c-2) production bridge (FederationDirectoryReplicationBridge over Arc<dyn FederationDirectory> + cohort callback + bounded FIFO cache) + FSD §3.1 AMENDMENT (persist_row_hash uniformly across all 10 kinds). 231 lib tests green. #65 ladder rungs 1-7 shipped; PyO3 init wiring remains before #65 closes "v1 feature complete." Persist v4.15.0 (JCS canonicalization flip — CEG 1.0 §0.9 milestone) is tagged but NOT yet on PyPI; persist explicitly carves out persist_row_hash as "internal, never crosses federation boundary" (stays V1Python forever) — that's a v1.6.2 cycle with FSD implications for the non-persist CEG interop posture documented in §3.2.1's transitional caveat.
  # ciris-lens-core: "0.4.5"  # STILL DROPPED — hard-pins ciris-persist==4.10.0, incompatible with persist v4.13.0. Same cascade-catch-up pattern: lens-core needs a 0.4.6 that relaxes ==4.10.0 → ==4.13.x. The v4.11/v4.12/v4.13 surfaces (geographic community admission + CryptoTier classifier + EncryptionPubkeys on identity_occurrence) are all additive over lens-core's consumed reads + Engine facades — pure pin bump on lens-core's side once it cycles. requires_lens cohabitation cells de-activate until then.
  # ciris-lens-core: "0.4.4"  # SHIPPED on PyPI but was dropped while the matrix moved to persist v4.10.0 (0.4.4 hard-pins ==4.9.0). Superseded by the active 0.4.5 entry above. Note the v0.4.4 cycle was blocked on the verify-5.0.0 ResolutionImpossible (persist 4.9's pyproject `ciris-verify<5`); persist v4.10.0's pyproject fix unblocked it.
  # ciris-lens-core: "0.4.3"  # original-line preserved — was dropped at the v4.4.0 → v4.8.0 persist cascade. Lens-core 0.4.3 hard-pinned ciris-persist==4.4.0, incompatible with persist v4.8.0 (the forward-secrecy revocation substrate). Lens-core shipped 0.4.4 catching up to persist 4.9.0 + verify 5.0.0 — but persist promptly moved to 4.10.0, so 0.4.4 is still incompatible with current matrix floor. See the 0.4.4 line above for the current cascade-catch-up state.
  # ciris-lens-core: "0.4.2"  # original-line preserved — was re-added after the §15.5 streaming-substrate cascade caught up. Dropped at 0.4.1 (hard-pinned ciris-persist==4.1.0, incompatible with persist v4.3.0). v0.4.2 relaxes the exact pin ==4.1.0 → ==4.3.0 + bumps edge 1.2.1 → 1.3.1 + keyring/crypto 4.8.1 → 4.10.0. Pure pin bump (zero source changes) — lens-core consumes ciris_persist::derived::* (calibration + detection-event reads, unmoved) + Engine facades (unchanged); the v4.2/v4.3 streaming-substrate continuation is off lens-core's path. Clean single-version lockfile re-resolve (persist 4.3.0 + verify 4.10.0, no skew); 120 lib tests green on rlib + python; full CI matrix (linux/macos/ios/android) green at 78190dc — one transient curl-56 flake on the iOS-sim external-framework download, cleared on re-run (not a code regression). requires_lens cohabitation cells re-activate. Same cascade-catch-up shape as 0.3.0 → 0.4.0 and 0.4.0 → 0.4.1; edge was the gating sister this cycle (held the 4.1.0 floor until edge 1.3.1 consumed persist 4.3.0). verify v4.11.0 exists but edge 1.3.1 pins 4.10.0 — lens-core matches.
  # ciris-lens-core: "0.4.1"  # original entry preserved — was re-added after the §15.5 streaming-substrate cascade caught up. Dropped at 0.4.0 (hard-pinned ciris-persist==4.0.1, incompatible with the persist v4.1.0 floor). v0.4.1 relaxes the exact pin ==4.0.1 → ==4.1.0 + bumps edge 1.2.0 → 1.2.1 + keyring/crypto 4.8.0 → 4.8.1. Pure pin bump (zero source changes) — lens-core consumes ciris_persist::derived::* (calibration + detection-event reads, unmoved) + Engine facades (unchanged); the v4.1 streaming substrate (CEG 0.10 §10.5 chunked blobs / transparency log / AES-256-GCM sealing) is a surface lens-core doesn't touch. Clean lockfile re-resolve unifies on persist 4.1.0 + verify 4.8.1 (no dual-version skew); 120 lib tests green on rlib + python; full CI matrix (linux/macos/ios/android, incl. new streaming crypto deps cross-compiling) green at c530a62. requires_lens cohabitation cells re-activate. This is the same cascade-catch-up shape as the 0.3.0 → 0.4.0 cycle, persist-minor floor this time rather than persist-major (hence lens-core patch, not minor).
  # ciris-node-core (not yet on PyPI) gets added here when it ships
  # federation-relevant Python surfaces requiring cohabitation
  # verification.

# Python interpreter version under test. Every wheel in the stack
# declares `requires-python = ">=3.10"` as of CIRISEdge v1.1.12; the
# abi3-py310 build (one wheel for all 3.10+) is the canonical shape.
# We exercise the floor (3.10) + a current minor (3.12) — covering
# the abi3 forward-compat promise without spending CI cycles on every
# minor in between.
python_versions:
  - "3.10"
  - "3.12"

# Known cross-artifact issues this matrix EXPECTS to fail. The
# corresponding tests carry @pytest.mark.xfail(strict=True). When an
# issue closes, remove from this list AND remove the xfail marker —
# strict=True will then flag any silent regression.
known_failures: []
# persist#109 closed in CIRISPersist v2.7.0 (PyCapsule cohabitation
# accessors) + consumed in CIRISEdge v0.9.2. test_init_edge_runtime_succeeds
# is no longer xfail-marked — it now passes against the bumped matrix,
# becoming the hard regression gate for cross-wheel cohabitation init.
