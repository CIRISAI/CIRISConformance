# Pinned wheel matrix under test. CI installs exactly these versions
# into a clean venv before running pytest. Adjust ONLY when the
# cohabitation contract is consciously updated — these pins are the
# canonical statement of "what's expected to work together right now."
#
# Update protocol:
#   1. Bump the relevant pin (e.g. ciris-edge: 0.9.2 after persist#109 lands)
#   2. Run `pytest` locally to verify; remove any `xfail` that now passes
#   3. PR; the under-test consumer repos see the new floor on their next merge
#
# Crates not yet shipping wheels (nodecore / lenscore / registry-core) are
# omitted; add them here when they cut their first PyPI release.

stack:
  # CIRIS family Python wheels on PyPI.
  # NOTE: ciris-keyring + ciris-crypto are Rust-only crates inside
  # CIRISVerify; they have NO Python wheels — they ride statically
  # inside ciris-verify + ciris-edge's compiled cdylib via Cargo.
  # ciris-verify is the Python surface that wraps them.
  ciris-persist: "3.6.9"  # bumped 3.6.8 → 3.6.9: CLOSES CIRISPersist#141 (macOS arm64 wheel statically bundled libsqlite3 — cargo-tree -i rusqlite traced the silent activator to ciris-verify-core v4.4.2's bundled-on-macOS feature; v3.6.9 bumps verify pin to v4.4.3 and adds a macOS Mach-O parity CI gate). Reopens CIRISEdge#50 closure on darwin: edge ALSO bundled and persist+edge in same Python process had two separate libsqlite3 instances → edge.so's never-initialized copy → SIGSEGV. Lift requires BOTH wheels' libsqlite3 to be dynamic.
  ciris-verify:  "4.6.0"   # bumped 4.4.3 → 4.6.0: v4.5.0 F-AV-RECONSIDER-DOS primitives + v4.6.0 hybrid KEX (X25519 + ML-KEM-768, ml-kem feature). NOTE: the v4.2.0 federation-crypto surfaces (witness_relation, humanity_accord invocation, STH cosignature consistency-proof) shipped in the verify Rust crate but are NOT on the published Python wheel surface — verified absent at verify 4.6.0 / persist 3.6.9, so not cross-wheel-drivable (Conformance#7).
  ciris-edge:    "1.1.3"  # bumped 1.0.1 → 1.1.3: CIRISEdge#50 darwin follow-on CLOSED end-to-end via the persist 3.6.9 / verify 4.4.3 cascade (drops macOS from rusqlite/bundled; both sibling wheels now NEED /usr/lib/libsqlite3.dylib → ONE libsqlite3 instance shared across cohab cdylibs via dyld). Carries the v1.1.0 routing-table FFI Leviculum gap-stub flips (CIRISEdge#44) + the v1.1.1/v1.1.2 scrub_signer routing (mirrors persist #137/#138 select_signer for the headless-keychain path). Darwin × sqlite test_durable_send is now a real regression gate.
  # ciris-lens-core (0.1.1 on PyPI) and ciris-node-core (not yet on
  # PyPI) get added here when they ship federation-relevant Python
  # surfaces requiring cohabitation verification.

# Python interpreter version under test. Edge ships abi3-py310 so 3.10
# is the floor; 3.11 / 3.12 / 3.13 should also pass cohabitation.
# NOTE: 3.10 is excluded because ciris-edge's PyPI pyproject declares
# `requires-python = ">=3.11"`. The Cargo `abi3-py310` build means the
# wheel is binary-compatible with py3.10+, but pip install from PyPI
# refuses it. py3.10 consumers that DO matter (Chaquopy on Android)
# ship their own interpreter and bundle the wheel directly, bypassing
# pip's requires-python check.
python_versions:
  - "3.11"
  - "3.12"

# Known cross-artifact issues this matrix EXPECTS to fail. The
# corresponding tests carry @pytest.mark.xfail(strict=True). When an
# issue closes, remove from this list AND remove the xfail marker —
# strict=True will then flag any silent regression.
known_failures: []
# persist#109 closed in CIRISPersist v2.7.0 (PyCapsule cohabitation
# accessors) + consumed in CIRISEdge v0.9.2. test_init_edge_runtime_succeeds
# is no longer xfail-marked — it now passes against the bumped matrix,
# becoming the hard regression gate for cross-wheel cohabitation init.
