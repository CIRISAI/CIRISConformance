# Pinned wheel matrix under test. CI installs exactly these versions
# into a clean venv before running pytest. Adjust ONLY when the
# cohabitation contract is consciously updated — these pins are the
# canonical statement of "what's expected to work together right now."
#
# Update protocol:
#   1. Bump the relevant pin (e.g. ciris-edge: 0.9.2 after persist#109 lands)
#   2. Run `pytest` locally to verify; remove any `xfail` that now passes
#   3. PR; the under-test consumer repos see the new floor on their next merge
#
# Crates not yet shipping wheels (nodecore / lenscore / registry-core) are
# omitted; add them here when they cut their first PyPI release.

stack:
  # CIRIS family Python wheels on PyPI.
  # NOTE: ciris-keyring + ciris-crypto are Rust-only crates inside
  # CIRISVerify; they have NO Python wheels — they ride statically
  # inside ciris-verify + ciris-edge's compiled cdylib via Cargo.
  # ciris-verify is the Python surface that wraps them.
  ciris-persist: "10.1.2"  # BUMPED 10.1.1 → 10.1.2 — the persist-10.1.2 / verify-7.4.0 / edge-7.0.6 triple. Patch bump alongside verify 7.4.0; suite green on both backends, no regression. PRIOR 7.0.0 → 10.1.1 — the persist-10 / edge-7.0.5 / verify-7.2 substrate floor. Closes CIRISPersist#275 (the #247 derived-key_id floor: register_self_federation_key now registers the DERIVED <label>-<fp> id + populates the ML-DSA-65 pubkey). HARNESS CONSEQUENCE: federation-tier emission (put_blob_signing holds_bytes + eviction withdraws) is now verified Ed25519+ML-DSA-65 Strict, so emission fixtures MUST construct a hybrid engine (local_pqc_key_id + local_pqc_key_path) — an Ed25519-only engine leaves the PQC pubkey absent → verify_hybrid_pqc_fields_mismatch. conftest's ceg_local_signer_preamble(pqc=...) + the federation fixture handle this. One residual cross-wheel red: edge stamps the BARE local_key_id as outbound sender_key_id while persist registers the derived id (CIRISEdge#203) → test_050 durable-send xfail(strict). PRIOR: 6.8.1 → 7.0.0 persist-7/edge-3.6/verify-5.6 triple. (edge v3.6.0 "CEWP-ready" co-bump; CEG 1.0-RC6). MAJOR 6→7, additive for consumers (CIRISServer built clean with zero code changes). Verified green by the full conformance suite at this triple incl. ciris-server under test. PRIOR: bumped 5.5.5 → 6.8.1 — the persist-6 triple. PRIOR: bumped 5.2.0 → 5.5.0 — the agent-2.9.6 substrate floor. v5.0 → v5.5 release train (v5.3 scoring-factors cache #195, v5.4 LocalIdentityAggregate v1 signing + content-KEM, v5.5 RET-transport role — full triple complete consuming edge v2.1.0's PyEdge::transport_identity_pubkeys()). Edge consumes additively — none of the v5.3/5.4/5.5 surfaces are on edge's federation hot path. lens-core 1.0.0 STILL hard-pins ciris-persist==5.2.0 (no 1.0.1 on PyPI yet); per the established cascade-catch-up pattern, lens-core drops from the active line below until 1.0.1 ships with a relaxed pin. EXPLICIT CARVE-OUT preserved: internal persist_row_hash + audit canonical_bytes_for_entry STAY V1Python; v2 federation wire moves to JCS independently per CEG 1.0-RC2 §0.9.
  ciris-verify:  "7.4.0"   # BUMPED 7.2.0 → 7.4.0 — exposes ciris_verify.rns_destination_hash (CIRISVerify#28, shipped v7.3.0): test_150's `test_wheel_recomputes_dest_hash_per_spec` self-flips from pytest.xfail to a REAL gate (the wheel's RNS dest-hash recompute now cross-checks the harness golden vectors). Federation-tier hybrid verify (Ed25519 + ML-DSA-65 Strict) still gates the #275 emission path. PRIOR: 5.6.0 → 7.2.0 verify-7 family floor under persist 10.1.1 / edge 7.0.5. PRIOR: 5.4.0 → 5.6.0 verify-family co-bump rode edge v3.6.0. (verify-core + keyring + crypto all at 5.6.0). PRIOR: bumped 5.1.3 → 5.4.0 — threshold/infrastructure_community quorum + sealed-Ed25519 #70. PRIOR: bumped 5.0.0 → 5.1.0 — CIRISVerify#65 operational_admit module: the callable surface CIRISPersist (v5.1.0+) invokes at put_organization / put_org_membership / put_partner_record. Ships ciris_verify_core::operational_admit::{resolve_role_authority (single-signer role-chain via delegates_to — the same #63/§8.1.12.7.1 resolver, applied to operational subject_kinds; explicitly NOT founder-quorum per the RC2 review), verify_partner_record_quorum (M-of-N steward quorum reusing the existing §5.6.8.10 founder-quorum verification — verify_founder_quorum + ThresholdSignature), check_set_semantics_sorted (the partner_record capability/restriction arrays MUST be lexicographically sorted so M stewards sign byte-identical JCS bytes — the load-bearing catch from the Verify review)}. ciris-verify-core / ciris-crypto / ciris-keyring all flipped together (same repo workspace; must stay coherent or two ciris_crypto versions land in the graph). Pure minor bump (verify version="5" constraint unchanged from 5.0.0; downstream consumers' Cargo constraint unchanged).
  ciris-edge:    "7.0.8"  # BUMPED 7.0.7 → 7.0.8 — adds the CIRISEdge#208 dispatch_inbound trust-gate PyO3 surface: PyEdge.set_trust_threshold(f64), install_trust_resolver(callback), dispatch_inbound_bytes(envelope_bytes, transport_id) -> {"outcome": "trust_short_circuited"|"received"|"verify_failed"}. The gate logic is present + correct (verified: a hand-built hybrid envelope passes persist's verify_hybrid_via_directory directly). BUT test_200 intake-gate stays xfail on CIRISEdge#211: there's no Python way to mint a valid inbound envelope_bytes — a hand-rolled envelope that passes DIRECT verify still fails the pipeline (subtle to_value/RawValue re-serialization mismatch), and the gate runs AFTER verify so an envelope must pass verify first. Needs an edge-side build_signed_inbound_envelope helper (#211). test_050 loopback remains separate (2-node transport, Conformance#4). PRIOR: 7.0.6 → 7.0.7 floor-currency (verify 7.4.0 + persist 10.1.2). PRIOR: 7.0.5 → 7.0.6 CLOSED CIRISEdge#203: edge stamps the DERIVED federation key_id as outbound sender_key_id (was bare local_key_id), so durable-send enqueue_outbound resolves the sender FK; test_050 durable-send flipped from xfail to a real gate. (7.0.5 was the edge-7 floor under persist 10.1.1 + verify 7.2.0.) PRIOR: 3.6.0 → 7.0.5 edge-7 floor; 3.5.1 → 3.6.0 "CEWP-ready" co-bump to persist 7.0.0 + verify 5.6.0. PRIOR: bumped 2.2.2 → 3.5.1 — RET transport-identity keystore, CEG-native replication + install_replication_routing #119/#120, realtime_av mesh #62. PRIOR: bumped 2.2.1 → 2.2.2 (CIRISEdge#97: Edge::local_dest_hash()/PyEdge::reticulum_dest_hash_hex() accessors — additive; lens-core 1.4.1+ links it to surface the dialable RNS address) + CI cache fixes. WAS: bumped 2.1.0 → 2.1.1 — persist v5.2.0 → v5.5.0 substrate-floor currency for CIRISAgent 2.9.6 + leviculum bump e63bb9a6 → 4c15dfd reticulum-std Windows port (CIRISEdge#87 / leviculum#10/#11 closed). The leviculum bump unblocks reticulum-std Windows compilation; the edge Windows wheel itself still fails at persist's Unix-only code paths (tokio::signal::unix in src/queue.rs + tokio_postgres::config::Host::Unix in src/store/postgres.rs) — tracked as CIRISPersist#200 + CIRISEdge#90; windows-x86_64 wheel matrix entry marked continue-on-error pending the persist fix. Layer 2 of the Windows toolchain (openssl-sys via vcpkg static x64-windows-static) validated working in edge#88's CI. Substrate floor consumed additively (persist v5.3 scoring-factors cache + v5.4/v5.5 LocalIdentityAggregate triple complete are not on edge's hot path). verify v5.1.0 unchanged.
