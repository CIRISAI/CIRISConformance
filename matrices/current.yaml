# Pinned wheel matrix under test. CI installs exactly these versions
# into a clean venv before running pytest. Adjust ONLY when the
# cohabitation contract is consciously updated — these pins are the
# canonical statement of "what's expected to work together right now."
#
# Update protocol:
#   1. Bump the relevant pin (e.g. ciris-edge: 0.9.2 after persist#109 lands)
#   2. Run `pytest` locally to verify; remove any `xfail` that now passes
#   3. PR; the under-test consumer repos see the new floor on their next merge
#
# Crates not yet shipping wheels (nodecore / lenscore / registry-core) are
# omitted; add them here when they cut their first PyPI release.

stack:
  # CIRIS family Python wheels on PyPI.
  # NOTE: ciris-keyring + ciris-crypto are Rust-only crates inside
  # CIRISVerify; they have NO Python wheels — they ride statically
  # inside ciris-verify + ciris-edge's compiled cdylib via Cargo.
  # ciris-verify is the Python surface that wraps them.
  ciris-persist: "4.0.1"  # bumped 3.14.3 → 4.0.1 (§15.5 consumer-migration cascade — Data Access Surface v4 lands). v4.0 closes AV-57 (read-side cohort_scope escalation) + AV-58 (write-side downgrade) by construction: CallerAdmission has no public constructor (substrate-only build_caller_admission); the §4.3 read predicate is pure target-membership (forged set impossible); §4.6 write gate runs verify-then-gate-then-persist with zero-writes-on-refusal. CIRISConformance#11 adversarial fire-test cleared all 10 attack surfaces across 3 rounds — see issue thread. 4.0.0 GitHub release exists but PyPI publish failed on a pyo3-no-backend wheel-build residual; 4.0.1 is the patched cut. Roll history through 3.14.x is preserved in git/release notes; this entry now anchors on the v4 cohabitation contract.
  ciris-verify:  "4.8.0"   # bumped 4.6.0 → 4.8.0: v4.7.0 full wheel-surface coverage + 15s budget enforcement (#50); v4.7.1 defer early-verify off .init_array (Linux glibc dlopen deadlock fix — #51, root-caused via tools/hang_diagnose.py); v4.8.0 robust parallel-path attestation with strict budgets (#52, ResilientRegistryClient parallel race over all registry endpoints under 10s RACE_BUDGET — closes Eric's S21U / Verizon LTE 90-second startup hang).
  ciris-edge:    "1.1.13"  # bumped 1.1.12 → 1.1.13: consumes persist v4.0.1 (Cargo tag + version "3"→"4", pyproject ciris-persist>=3.6.3,<4 → >=4.0.1,<5). Metadata-only — clippy + fmt + 4 CI feature combos clean; zero source-code changes. race_repro × 50 each backend at edge 1.1.13 + persist 4.0.1 + verify 4.8.0: sqlite p50=100ms p95=109ms, postgres p50=108ms p95=153ms (latency uptick is the new v4 scope-admission gate, all within timeout). Prior history: 1.1.7/1.1.8/1.1.9 never published; 1.1.10 consumed persist 3.14.3 (executor_capsule + sqlite inline-sync rewrite, closes CIRISEdge#58 end-to-end); 1.1.11 leviculum PR #9 lossless event channel; 1.1.12 pyproject requires-python 3.11→3.10 alignment.
  # ciris-lens-core temporarily DROPPED from the cohabitation matrix
  # while it catches the §15.5 consumer-migration cascade. Lens-core
  # 0.3.0 hard-pins `ciris-persist==3.14.3` — incompatible with the
  # v4.0.1 substrate the rest of the matrix now anchors on. Re-add
  # at the first lens-core release that relaxes to allow persist 4.x
  # (likely v0.4.x or v0.5.x per CIRISLensCore #14/#15/#20). Tests
  # carrying `@pytest.mark.requires_lens` will SKIP cleanly under the
  # current matrix; cohabitation cells for the rest of the stack pass.
  # ciris-node-core (not yet on PyPI) gets added here when it ships
  # federation-relevant Python surfaces requiring cohabitation
  # verification.

# Python interpreter version under test. Every wheel in the stack
# declares `requires-python = ">=3.10"` as of CIRISEdge v1.1.12; the
# abi3-py310 build (one wheel for all 3.10+) is the canonical shape.
# We exercise the floor (3.10) + a current minor (3.12) — covering
# the abi3 forward-compat promise without spending CI cycles on every
# minor in between.
python_versions:
  - "3.10"
  - "3.12"

# Known cross-artifact issues this matrix EXPECTS to fail. The
# corresponding tests carry @pytest.mark.xfail(strict=True). When an
# issue closes, remove from this list AND remove the xfail marker —
# strict=True will then flag any silent regression.
known_failures: []
# persist#109 closed in CIRISPersist v2.7.0 (PyCapsule cohabitation
# accessors) + consumed in CIRISEdge v0.9.2. test_init_edge_runtime_succeeds
# is no longer xfail-marked — it now passes against the bumped matrix,
# becoming the hard regression gate for cross-wheel cohabitation init.
