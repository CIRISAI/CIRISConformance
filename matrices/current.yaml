  # ciris-lens-core: ABSORBED into ciris-server — CIRISServer OWNS lens-core now (vendored in-tree; the standalone CIRISLensCore wheel + repo are retired). The lens Python surface is re-exported INSIDE the ciris-server wheel via the same ffi::pyo3::register(); lens-core is NOT a separate matrix pin (1.4.2 hard-pins persist <6 anyway, no 1.5.0). Prior active lens-core pin preserved below for history.
  # ciris-lens-core: "1.4.2"  # BUMPED 1.4.0 → 1.4.2 (1.4.0 PyO3 install_ret_relay + transport pubkeys for persist local_identity_aggregate #199; 1.4.1 surfaces the dialable RNS dest hash via edge v2.2.2 Edge::local_dest_hash() #97; 1.4.2 adds RetRelay.transport_identity_pubkeys() edge-parity dict handle). Full floor persist 5.5.5 + edge 2.2.2 + verify 5.1.3 + lens-core 1.4.2 pip-resolves clean. WAS: BUMPED 1.2.0 → 1.4.0 (supersedes 1.3.0 crc-v2 detectors + 1.3.1 concern_direction, both folded in; 1.3.1 PyPI publish was cancelled in favour of 1.4.0). 1.4.0 adds the PyO3 install_ret_relay surface — brings up the Reticulum transport from Python + exposes the transport pubkeys (transport_x25519/ed25519_pubkey_b64) for persist's Engine.local_identity_aggregate (#199) RET-transport role. 1.3.0 consumed RATCHET crc-v2 (8 F-3/distributive axes live). Substrate floor UNCHANGED at persist 5.5.5 / verify 5.1.3 / edge 2.2.1 — pure lens-core feature roll, full floor still pip-resolves clean, all 4 wheels incl. Win7 win_amd64 live on PyPI. (1.4.1 will flip edge → v2.2.2 to surface the RNS dest hash via the new Edge::local_dest_hash() accessor, CIRISEdge#97.) WAS 1.2.0 → 1.4.0; prior-line history preserved below. ───── BUMPED 1.0.1 → 1.2.0 (CIRISLensCore#48 Win7 + the v2.2.1 substrate floor). COMPLETES THE FAMILY WIN7 CHAIN: lens-core's win_amd64 wheel now builds with the Tier-3 x86_64-win7-windows-msvc target via nightly -Zbuild-std + vcpkg static OpenSSL (was stable-Rust → Win8/Win10-only hard-imports through 1.0.1/1.1.0) — Win7 SP1 / Server 2008 R2 → Win11, matching persist 5.5.5 / verify 5.1.3 / edge 2.2.1. Floor flip: Cargo persist v5.5.5 + edge v2.2.1 + keyring v5.1.3; pyproject ciris-persist >=5.2.0,<6 → >=5.5.5,<6 (Win7-capable + RUSTSEC-2026-0178/0179/0180-fixed host floor; the <6 ceiling holds the family on pyo3 0.28 / persist 5.x until the lockstep cut). 1.2.0 also folds the previously-unreleased science layer (#3 manifold mahalanobis + #12 audit + #14 egress filter), the node-mode read API (#15, 7 frozen GET /lens/api/v1/* endpoints), and the #34 RET-native scaffold (transport-reticulum + ret_relay + ciris-canonical enrollment + CEG egress; full cutover gated on CIRISEdge#95 / CIRISRegistry#73). Full floor (persist 5.5.5 + verify 5.1.3 + edge 2.2.1 + lens-core 1.2.0) pip-resolves clean; all 4 wheels incl. Win7 win_amd64 live on PyPI. requires_lens cohabitation cells stay active.
  # ciris-lens-core: "1.0.1"  # SUPERSEDED by 1.2.0 above (Win7 + v2.2.1 floor). Was: RE-ADDED — the agent-fold patch (CIRISLensCore#43). Relaxes the v1.0.0 exact pin ==5.2.0 → >=5.2.0,<6 (cohabitation is now name-based Python dispatch — LensClient(engine=...) + edge 2.1.1 PyEdge::engine() — version-tolerant across v5, so lens-core need not dictate the persist version). Full floor (persist 5.5.2 + verify 5.1.0 + edge 2.1.1 + lens-core 1.0.1) pip-resolves clean. 1.0.1 carries: #43.1 P0 cross-wheel Engine fix (current_rust_engine OnceLock gap → Python-method dispatch on the host PyEngine), #43.2 JCS/3.0.0 trace-stamp flip (canon_version_for_trace_schema dispatch), #43.3 release artifacts + a Windows wheel that NEVER REACHED PyPI (publish-pypi/windows artifact race — fixed in lens-core 1.1.0; the first real win_amd64 on PyPI was 1.1.0, the first Win7-capable one is 1.2.0). v5.3/5.4/5.5 persist surfaces additive over lens-core's consumed reads.
