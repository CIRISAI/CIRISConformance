# Pinned wheel matrix under test. CI installs exactly these versions
# into a clean venv before running pytest. Adjust ONLY when the
# cohabitation contract is consciously updated — these pins are the
# canonical statement of "what's expected to work together right now."
#
# Update protocol:
#   1. Bump the relevant pin (e.g. ciris-edge: 0.9.2 after persist#109 lands)
#   2. Run `pytest` locally to verify; remove any `xfail` that now passes
#   3. PR; the under-test consumer repos see the new floor on their next merge
#
# Crates not yet shipping wheels (nodecore / lenscore / registry-core) are
# omitted; add them here when they cut their first PyPI release.

stack:
  # CIRIS family Python wheels on PyPI.
  # NOTE: ciris-keyring + ciris-crypto are Rust-only crates inside
  # CIRISVerify; they have NO Python wheels — they ride statically
  # inside ciris-verify + ciris-edge's compiled cdylib via Cargo.
  # ciris-verify is the Python surface that wraps them.
  ciris-persist: "4.9.0"  # bumped 4.8.0 → 4.9.0 — adds the PyO3 attestation_promote binding (#171 phase 2, CEG §10.1.5). The agent's 2.9.6 community-server opt-in writes a `witness_relation: self` local-tier row via attestation_upsert_local (v4.4), then promotes it to federation tier at federation-emit time via attestation_promote (v4.6.0 Engine method; v4.9.0 exposes via PyO3 to the Python agent layer). Edge consumes persist via Rust-internal Engine surface — the new Py binding is on the agent's consumption path, NOT edge's. Pure pin currency on edge's side. Prior chain to v4.8.0 (the CEG 1.0 / Agent 3.0 substrate train: JCS foundation, typed register_public_key, Option-A forward-secrecy revocation primitives) preserved in release notes. Persist v4.9.0 pyproject STILL pins ciris-verify<5 — the v5.0.0 substrate move was Rust-side only on persist's side, so the Python ciris-verify wheel ceiling stays at 4.11.0.
  ciris-verify:  "4.11.0"   # HELD at 4.11.0 (NOT moved to 5.0.0) — persist v4.8.0's PUBLISHED pyproject pins `ciris-verify<5,>=4.4.2`, so installing `ciris-verify==5.0.0` alongside persist 4.8.0 is `ResolutionImpossible`. The Rust-internal verify v5.0.0 (the structural `version="4"→"5"` flip on the keyring/crypto Cargo pins) lives inside edge's compiled cdylib and persist's compiled cdylib independently — those are the symbol-table contract. The Python `ciris-verify` wheel that ends up installed is a SEPARATE cdylib at a SEPARATE process-boundary; neither edge nor persist (via PyCapsule cohabitation) imports it. Holding here at 4.11.0 = matching persist 4.8.0's pyproject ceiling. The matrix moves to 5.0.0 once persist publishes a 4.9.x+ that bumps its pyproject `ciris-verify` pin to `>=5,<6` (the dual of how the matrix waited for persist v4.4.0 PyPI propagation in the v1.3.2 cycle). v5.0.0 SHIPPED on PyPI (CEG 1.0 / Agent 3.0 release — #58 key_grant v2 + #54 hybrid-signed doc_integrity + #55 RNG health-check + #59 JCS verify + #60 boundary_degraded + #61 jcs_canonicalize Py binding + #31 CEG 0.11 infrastructure_community), but the Python-side cohabitation ceiling is what governs the matrix; the on-Cargo cohabitation contract (verify v5.0.0) is already asserted by edge v1.4.0's wheel-build job + persist v4.6.1+ build job.
  ciris-edge:    "1.4.1"  # bumped 1.4.0 → 1.4.1 — TWO-FOLD patch cut: (1) substrate pin currency persist v4.8.0 → v4.9.0 (consuming the new PyO3 attestation_promote binding on the agent-Py path — orthogonal to edge); (2) v1.4 PyPI recovery — v1.4.0 release CI failed all 6 cohabitation jobs due to a stale extract-substrate-pins workflow job that emitted ciris-verify==5.0.0 as a Python pin-override, conflating the Cargo-side verify v5.0.0 (Rust crate compiled into the cdylib symbol tables) with the Python ciris-verify wheel (separate cdylib at a separate process boundary). Persist v4.8.0's pyproject pins ciris-verify<5; ResolutionImpossible. The workflow fix landed on main at e01ba90 (drops the ciris-verify pin-override; lets persist's pyproject resolve the Python wheel transitively). v1.4.1 is the first cut of the v1.4 line that ships through the fixed pin-extractor — v1.4.0 stays as a partial release (GH artifacts uploaded, PyPI publish skipped); pip users go 1.3.2 → 1.4.1 on the v1.4 line. Cargo-side verify v5.0.0 unchanged. race_repro × 50 each backend at edge 1.4.1 + persist 4.9.0 + verify 5.0.0: sqlite p50=116ms p95=130ms, postgres p50=70ms p95=105ms — comparable to v1.4.0 baseline, no regression. v1.3.x prior history preserved in release notes (persist v4.1/v4.3/v4.4 catch-up + the #53/#54/#62 trio + the #65 replication module ladder).
  # ciris-lens-core: "0.4.3"  # dropped at v4.4.0 → v4.8.0 persist cascade. Lens-core 0.4.3 hard-pinned ciris-persist==4.4.0, incompatible with persist v4.8.0 (the forward-secrecy revocation substrate). Same cascade-catch-up shape as prior cycles: lens-core releases a 0.4.4 that relaxes the exact pin ==4.4.0 → ==4.8.0 + bumps edge 1.3.2 → 1.4.0 + keyring/crypto 4.11.0 → 5.0.0 (the version="4"→"5" structural flip on the lens-core side too). Persist v4.5-v4.8 surfaces (attestation_query read / JCS produce gate / typed register_public_key / forward-secrecy revocation) are all additive over lens-core's consumed surfaces (ciris_persist::derived::* calibration + detection-event reads, Engine facades) — pure pin bump on lens-core's side once it cycles. requires_lens cohabitation cells re-activate after that.
  # ciris-lens-core: "0.4.2"  # original-line preserved — was re-added after the §15.5 streaming-substrate cascade caught up. Dropped at 0.4.1 (hard-pinned ciris-persist==4.1.0, incompatible with persist v4.3.0). v0.4.2 relaxes the exact pin ==4.1.0 → ==4.3.0 + bumps edge 1.2.1 → 1.3.1 + keyring/crypto 4.8.1 → 4.10.0. Pure pin bump (zero source changes) — lens-core consumes ciris_persist::derived::* (calibration + detection-event reads, unmoved) + Engine facades (unchanged); the v4.2/v4.3 streaming-substrate continuation is off lens-core's path. Clean single-version lockfile re-resolve (persist 4.3.0 + verify 4.10.0, no skew); 120 lib tests green on rlib + python; full CI matrix (linux/macos/ios/android) green at 78190dc — one transient curl-56 flake on the iOS-sim external-framework download, cleared on re-run (not a code regression). requires_lens cohabitation cells re-activate. Same cascade-catch-up shape as 0.3.0 → 0.4.0 and 0.4.0 → 0.4.1; edge was the gating sister this cycle (held the 4.1.0 floor until edge 1.3.1 consumed persist 4.3.0). verify v4.11.0 exists but edge 1.3.1 pins 4.10.0 — lens-core matches.
  # ciris-lens-core: "0.4.1"  # original entry preserved — was re-added after the §15.5 streaming-substrate cascade caught up. Dropped at 0.4.0 (hard-pinned ciris-persist==4.0.1, incompatible with the persist v4.1.0 floor). v0.4.1 relaxes the exact pin ==4.0.1 → ==4.1.0 + bumps edge 1.2.0 → 1.2.1 + keyring/crypto 4.8.0 → 4.8.1. Pure pin bump (zero source changes) — lens-core consumes ciris_persist::derived::* (calibration + detection-event reads, unmoved) + Engine facades (unchanged); the v4.1 streaming substrate (CEG 0.10 §10.5 chunked blobs / transparency log / AES-256-GCM sealing) is a surface lens-core doesn't touch. Clean lockfile re-resolve unifies on persist 4.1.0 + verify 4.8.1 (no dual-version skew); 120 lib tests green on rlib + python; full CI matrix (linux/macos/ios/android, incl. new streaming crypto deps cross-compiling) green at c530a62. requires_lens cohabitation cells re-activate. This is the same cascade-catch-up shape as the 0.3.0 → 0.4.0 cycle, persist-minor floor this time rather than persist-major (hence lens-core patch, not minor).
  # ciris-node-core (not yet on PyPI) gets added here when it ships
  # federation-relevant Python surfaces requiring cohabitation
  # verification.

# Python interpreter version under test. Every wheel in the stack
# declares `requires-python = ">=3.10"` as of CIRISEdge v1.1.12; the
# abi3-py310 build (one wheel for all 3.10+) is the canonical shape.
# We exercise the floor (3.10) + a current minor (3.12) — covering
# the abi3 forward-compat promise without spending CI cycles on every
# minor in between.
python_versions:
  - "3.10"
  - "3.12"

# Known cross-artifact issues this matrix EXPECTS to fail. The
# corresponding tests carry @pytest.mark.xfail(strict=True). When an
# issue closes, remove from this list AND remove the xfail marker —
# strict=True will then flag any silent regression.
known_failures: []
# persist#109 closed in CIRISPersist v2.7.0 (PyCapsule cohabitation
# accessors) + consumed in CIRISEdge v0.9.2. test_init_edge_runtime_succeeds
# is no longer xfail-marked — it now passes against the bumped matrix,
# becoming the hard regression gate for cross-wheel cohabitation init.
