name: conformance

# Self-test for the harness itself: install the pinned wheels from
# matrices/current.yaml into a clean venv, run pytest, surface the
# xfail / skip / pass breakdown.
#
# This is the GROUND TRUTH job — if it stays green, the
# matrices/current.yaml + xfail markers accurately describe the
# state of the federation cohabitation contract. A turn-red in this
# job means EITHER the matrix needs updating (a pin moved) OR a
# regression slipped into one of the pinned wheels.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily run catches the case where a new release of a pinned
    # crate (e.g. via `pip install --upgrade`) introduces a
    # cohabitation regression that no PR triggered. The matrix
    # is hash-pinned so this only fires on intentional matrix
    # updates, but new transitive deps can still drift the
    # cohabitation surface.
    - cron: "13 7 * * *"

jobs:
  conformance:
    name: conformance (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install harness + dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: install pinned ciris-* wheels from matrices/current.yaml
        run: |
          python -c "
          import yaml, subprocess, sys
          matrix = yaml.safe_load(open('matrices/current.yaml'))
          pins = matrix['stack']
          # Install with exact pins (== not >=) so the harness tests
          # the precise cohabitation contract, not a floating set.
          install_args = [f'{pkg}=={ver}' for pkg, ver in pins.items()]
          print(f'Installing: {install_args}')
          result = subprocess.run([sys.executable, '-m', 'pip', 'install', *install_args])
          sys.exit(result.returncode)
          "

      - name: run conformance suite
        run: pytest -v --tb=short

      - name: surface known-failure summary
        if: always()
        run: |
          python -c "
          import yaml
          m = yaml.safe_load(open('matrices/current.yaml'))
          kf = m.get('known_failures', [])
          if not kf:
              print('No known-failure entries in current matrix.')
          else:
              print('Cross-artifact issues this run EXPECTS to fail (xfail):')
              for entry in kf:
                  print(f'  - {entry[\"id\"]}: {entry[\"title\"]}')
                  print(f'    {entry[\"url\"]}')
                  for t in entry.get('affects', []):
                      print(f'    test: {t}')
          "
