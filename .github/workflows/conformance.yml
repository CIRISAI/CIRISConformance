name: conformance

# Self-test for the harness itself: install the pinned wheels from
# matrices/current.yaml into a clean venv, run pytest against both
# sqlite AND postgres backends, surface the xfail / skip / pass
# breakdown.
#
# This is the GROUND TRUTH job — if it stays green, the
# matrices/current.yaml + xfail markers accurately describe the
# state of the federation cohabitation contract. A turn-red here
# means EITHER the matrix needs updating (a pin moved) OR a
# regression slipped into one of the pinned wheels.
#
# The cross-platform matrix lives in caller repos (each repo
# tests its just-built artifact against (platform × backend) via the
# reusable `run-against-wheels.yml` workflow). This job only needs
# to assert "the harness itself is structurally sound against the
# published wheels" — ubuntu-latest × (sqlite, postgres) suffices.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily: catches the case where a new release of a pinned crate
    # introduces a cohabitation regression that no PR triggered.
    # Matrix is hash-pinned so this only fires on intentional matrix
    # updates, but new transitive deps can still drift the
    # cohabitation surface.
    - cron: "13 7 * * *"

jobs:
  conformance:
    name: conformance (py${{ matrix.python }}, ${{ matrix.backend }}, ${{ matrix.runner || 'ubuntu-latest' }})
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # py3.10 is the abi3 floor — every wheel in the substrate ships
        # cp310-abi3 + declares `requires-python = ">=3.10"` (edge aligned
        # to >=3.10 in v1.1.12; persist / verify / lens-core were already
        # there). The Chaquopy bundle path on Android still runs through
        # the separate `chaquopy-bundle-py310` job because its install
        # mechanism (bundled wheels, not pip) is its own surface; this
        # job exercises the regular `pip install` flow on py3.10.
        # Both backends, fully, on every platform — sqlite and postgres
        # must have parity. x86_64 covers py3.10 + py3.12 × {sqlite, postgres};
        # the include adds the aarch64 production architecture (the agent
        # ships on Android arm64) for BOTH backends too.
        python: ["3.10", "3.12"]
        backend: ["sqlite", "postgres"]
        include:
          - { python: "3.12", backend: sqlite,   runner: ubuntu-24.04-arm }
          - { python: "3.12", backend: postgres, runner: ubuntu-24.04-arm }
    env:
      CIRIS_CONFORMANCE_DATABASE_URL: ${{ matrix.backend == 'postgres' && 'postgres://postgres:postgres@localhost:5432/conformance' || 'sqlite::memory:' }}
    steps:
      - uses: actions/checkout@v4

      - name: set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: start postgres (backend=${{ matrix.backend }})
        if: matrix.backend == 'postgres'
        # Self-healing: PostgreSQL as a Docker container (Docker is
        # pre-installed on GitHub Linux runners, x86_64 AND arm). The
        # official image self-initializes cluster + role + database from
        # env — no apt, no `/etc/postgresql` cluster fragility, no pg_hba
        # editing. Same approach as run-against-wheels.yml so the self-test
        # and the caller-facing reusable workflow exercise identical setup.
        run: |
          docker run -d --name conformance-pg \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=conformance \
            -p 5432:5432 \
            --health-cmd "pg_isready -U postgres -d conformance" \
            --health-interval 5s --health-timeout 5s --health-retries 10 \
            postgres:16
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' conformance-pg 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then echo "postgres healthy after ~$((i*2))s"; break; fi
            if [ "$status" = "unhealthy" ]; then docker logs conformance-pg; echo "::error::postgres unhealthy"; exit 1; fi
            sleep 2
          done
          docker exec conformance-pg psql -U postgres -d conformance -c "SELECT version();"

      - name: install harness + dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: install pinned ciris-* wheels from matrices/current.yaml
        # Retries only on a PyPI/CDN propagation race (a just-published pin not
        # yet on this runner's edge); fails fast on a real ResolutionImpossible.
        # See tools/install_pins.py.
        run: python tools/install_pins.py

      - name: run conformance suite (py${{ matrix.python }} × ${{ matrix.backend }})
        run: |
          echo "::group::Environment"
          echo "python:   $(python --version)"
          echo "backend:  ${{ matrix.backend }}"
          echo "url:      ${CIRIS_CONFORMANCE_DATABASE_URL}"
          echo "::endgroup::"
          pytest -v --tb=short

      - name: surface known-failure summary
        if: always()
        run: |
          python -c "
          import yaml
          m = yaml.safe_load(open('matrices/current.yaml'))
          kf = m.get('known_failures', [])
          if not kf:
              print('No known-failure entries in current matrix.')
          else:
              print('Cross-artifact issues this run EXPECTS to fail (xfail):')
              for entry in kf:
                  print(f'  - {entry[\"id\"]}: {entry[\"title\"]}')
                  print(f'    {entry[\"url\"]}')
                  for t in entry.get('affects', []):
                      print(f'    test: {t}')
          "

  chaquopy-bundle-py310:
    # The production-mobile bundling path. CIRISAgent ships the substrate
    # sisters into an Android app via Chaquopy, which runs its own Python
    # 3.10 and bundles the wheels directly — bypassing pip's Requires-Python
    # entirely (the wheels declare `>=3.10` as of edge v1.1.12; Chaquopy still
    # passes `--ignore-requires-python` defensively in case any wheel ever
    # regressed off py3.10). The wheels are `cp310-abi3`, so they are binary-
    # compatible with 3.10; this job reproduces that bundling path on the
    # actual py3.10 interpreter and runs the cohab-init + mobile-target gates.
    # If a wheel ever stops being abi3 (or the abi3 .so breaks on 3.10), the
    # Android bundle breaks — this turns red before the app ships it.
    name: chaquopy bundle path (py3.10, --ignore-requires-python)
    runs-on: ubuntu-latest
    env:
      CIRIS_CONFORMANCE_DATABASE_URL: "sqlite::memory:"
    steps:
      - uses: actions/checkout@v4

      - name: set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: install harness + dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: bundle pinned ciris-* wheels (Chaquopy-style — bypass requires-python)
        # Exactly what Chaquopy does: take the cp310-abi3 wheel and ignore the
        # metadata floor entirely (defensive — every wheel is at >=3.10 now, but
        # the flag costs nothing and guards a future regression). Same
        # propagation-race retry as the core cells (tools/install_pins.py).
        run: python tools/install_pins.py --ignore-requires-python

      - name: run mobile-target + cohab-init gates on py3.10
        run: |
          echo "python: $(python --version)"
          pytest -v --tb=short \
            tests/test_080_mobile_target.py \
            tests/test_030_cohabitation_init.py \
            tests/test_070_hsm_transport_identity.py
