name: conformance

# Self-test for the harness itself: install the pinned wheels from
# matrices/current.yaml into a clean venv, run pytest against both
# sqlite AND postgres backends, surface the xfail / skip / pass
# breakdown.
#
# This is the GROUND TRUTH job — if it stays green, the
# matrices/current.yaml + xfail markers accurately describe the
# state of the federation cohabitation contract. A turn-red here
# means EITHER the matrix needs updating (a pin moved) OR a
# regression slipped into one of the pinned wheels.
#
# The cross-platform matrix lives in caller repos (each repo
# tests its just-built artifact against (platform × backend) via the
# reusable `run-against-wheels.yml` workflow). This job only needs
# to assert "the harness itself is structurally sound against the
# published wheels" — ubuntu-latest × (sqlite, postgres) suffices.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily: catches the case where a new release of a pinned crate
    # introduces a cohabitation regression that no PR triggered.
    # Matrix is hash-pinned so this only fires on intentional matrix
    # updates, but new transitive deps can still drift the
    # cohabitation surface.
    - cron: "13 7 * * *"

jobs:
  conformance:
    name: conformance (py${{ matrix.python }}, ${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # NOTE: py3.10 is excluded because ciris-edge's pyproject declares
        # `requires-python = ">=3.11"` — pip refuses py3.10 install from
        # PyPI even though the Cargo `abi3-py310` build means the wheel is
        # binary-compatible with py3.10+ at the ABI level. The py3.10
        # consumer that matters (Chaquopy on Android) ships its own
        # interpreter and bundles the wheel directly, bypassing pip's
        # requires-python check. If a published wheel ever moves its
        # pyproject floor to >=3.10, add "3.10" back here.
        python: ["3.11", "3.12"]
        backend: ["sqlite", "postgres"]
    env:
      CIRIS_CONFORMANCE_DATABASE_URL: ${{ matrix.backend == 'postgres' && 'postgres://postgres:postgres@localhost:5432/conformance' || 'sqlite::memory:' }}
    steps:
      - uses: actions/checkout@v4

      - name: set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: start postgres (backend=${{ matrix.backend }})
        if: matrix.backend == 'postgres'
        # ubuntu-latest pre-installs postgresql; install on-demand if
        # absent. Mirror the same setup logic the reusable
        # run-against-wheels.yml uses so any drift here surfaces against
        # the same SQL surface caller repos exercise.
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql postgresql-client
          fi
          PG_VERSION=$(ls /etc/postgresql 2>/dev/null | head -1)
          if [ -z "$PG_VERSION" ]; then
            echo "::error::PostgreSQL install broken — /etc/postgresql empty"
            exit 1
          fi
          sudo pg_ctlcluster "$PG_VERSION" main start || \
            sudo systemctl start postgresql || \
            sudo service postgresql start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb conformance
          PG_HBA=$(sudo -u postgres psql -tAc "SHOW hba_file;")
          sudo sed -i 's/^\(host\s\+all\s\+all\s\+127.0.0.1\/32\s\+\)\w\+$/\1md5/' "$PG_HBA"
          sudo sed -i 's/^\(host\s\+all\s\+all\s\+::1\/128\s\+\)\w\+$/\1md5/' "$PG_HBA"
          sudo pg_ctlcluster "$PG_VERSION" main reload || \
            sudo systemctl reload postgresql || \
            sudo service postgresql reload
          PGPASSWORD=postgres psql -h localhost -U postgres -d conformance -c "SELECT version();"

      - name: install harness + dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: install pinned ciris-* wheels from matrices/current.yaml
        run: |
          python -c "
          import yaml, subprocess, sys
          matrix = yaml.safe_load(open('matrices/current.yaml'))
          pins = matrix['stack']
          install_args = [f'{pkg}=={ver}' for pkg, ver in pins.items()]
          print(f'Installing: {install_args}')
          result = subprocess.run([sys.executable, '-m', 'pip', 'install', *install_args])
          sys.exit(result.returncode)
          "

      - name: run conformance suite (py${{ matrix.python }} × ${{ matrix.backend }})
        run: |
          echo "::group::Environment"
          echo "python:   $(python --version)"
          echo "backend:  ${{ matrix.backend }}"
          echo "url:      ${CIRIS_CONFORMANCE_DATABASE_URL}"
          echo "::endgroup::"
          pytest -v --tb=short

      - name: surface known-failure summary
        if: always()
        run: |
          python -c "
          import yaml
          m = yaml.safe_load(open('matrices/current.yaml'))
          kf = m.get('known_failures', [])
          if not kf:
              print('No known-failure entries in current matrix.')
          else:
              print('Cross-artifact issues this run EXPECTS to fail (xfail):')
              for entry in kf:
                  print(f'  - {entry[\"id\"]}: {entry[\"title\"]}')
                  print(f'    {entry[\"url\"]}')
                  for t in entry.get('affects', []):
                      print(f'    test: {t}')
          "
