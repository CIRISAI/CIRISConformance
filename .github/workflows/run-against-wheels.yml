name: run-against-wheels

# Reusable workflow invoked from sibling CIRIS repos. Lets each repo's
# tag-run verify cohabitation against its just-built artifact + the
# rest of the pinned stack BEFORE that artifact ships to PyPI.
#
# Two-axis matrix per caller: (platform × backend). Caller drives both
# via the `runs-on` and `backend` inputs — typically passed via the
# caller's own `strategy.matrix`.
#
# Example usage from CIRISEdge/.github/workflows/ci.yml:
#
#   conformance:
#     needs: [pyo3-wheel]
#     strategy:
#       fail-fast: false
#       matrix:
#         include:
#           - { platform: linux-x86_64,   runs-on: ubuntu-latest,    backend: sqlite }
#           - { platform: linux-x86_64,   runs-on: ubuntu-latest,    backend: postgres }
#           - { platform: linux-aarch64,  runs-on: ubuntu-24.04-arm, backend: sqlite }
#           - { platform: linux-aarch64,  runs-on: ubuntu-24.04-arm, backend: postgres }
#           - { platform: darwin-aarch64, runs-on: macos-14,         backend: sqlite }
#           - { platform: darwin-aarch64, runs-on: macos-14,         backend: postgres }
#     uses: CIRISAI/CIRISConformance/.github/workflows/run-against-wheels.yml@main
#     with:
#       runs-on: ${{ matrix.runs-on }}
#       backend: ${{ matrix.backend }}
#       under-test-wheel-artifact: ciris_edge-wheel-${{ matrix.platform }}
#       under-test-package: ciris-edge
#
# A failure here in the caller's tag-run BLOCKS publish-pypi — the
# under-test artifact failed its cohabitation contract.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "GitHub Actions runner label (ubuntu-latest, ubuntu-24.04-arm, macos-14)"
        required: true
        type: string
      backend:
        description: "Persist backend to exercise (sqlite | postgres)"
        required: true
        type: string
      under-test-wheel-artifact:
        description: "actions/upload-artifact name carrying the wheel under test"
        required: true
        type: string
      under-test-package:
        description: "PyPI package name (e.g. ciris-edge) — used to override the pinned version"
        required: true
        type: string
      matrix-ref:
        description: "git ref of CIRISConformance to run against"
        required: false
        type: string
        default: "main"
      python-version:
        description: "Python interpreter version"
        required: false
        type: string
        default: "3.12"

jobs:
  conformance:
    runs-on: ${{ inputs.runs-on }}
    env:
      # The harness reads this; sqlite default keeps the env variable
      # set unconditionally so test failures attribute correctly.
      CIRIS_CONFORMANCE_DATABASE_URL: ${{ inputs.backend == 'postgres' && 'postgres://postgres:postgres@localhost:5432/conformance' || 'sqlite::memory:' }}
    steps:
      - name: clone CIRISConformance @ ${{ inputs.matrix-ref }}
        uses: actions/checkout@v4
        with:
          repository: CIRISAI/CIRISConformance
          ref: ${{ inputs.matrix-ref }}
          path: conformance

      - name: set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: start postgres (Linux) — backend=${{ inputs.backend }}
        if: inputs.backend == 'postgres' && runner.os == 'Linux'
        # Self-healing: run PostgreSQL as a Docker container instead of the
        # apt `pg_ctlcluster` dance. Docker is pre-installed on every
        # GitHub-hosted Linux runner (x86_64 AND arm), and the official
        # `postgres` image self-initializes the cluster + role + database
        # from env — so there is no `/etc/postgresql is empty`, no
        # systemd/cluster fragility, no pg_hba editing. This mirrors the
        # `services:` postgres container CIRISPersist + CIRISAgent CI use
        # (we use a step, not a `services:` block, because this reusable
        # job's runner is parameterized and may be macOS, where `services:`
        # containers are unavailable).
        run: |
          docker run -d --name conformance-pg \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=conformance \
            -p 5432:5432 \
            --health-cmd "pg_isready -U postgres -d conformance" \
            --health-interval 5s --health-timeout 5s --health-retries 10 \
            postgres:16
          # Wait until the container reports healthy (max ~60s) — robust to
          # slow image pulls / cold runners.
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' conformance-pg 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then echo "postgres healthy after ~$((i*2))s"; break; fi
            if [ "$status" = "unhealthy" ]; then docker logs conformance-pg; echo "::error::postgres container unhealthy"; exit 1; fi
            sleep 2
          done
          # Smoke check via the container's own psql (no runner-side client needed).
          docker exec conformance-pg psql -U postgres -d conformance -c "SELECT version();"

      - name: start postgres (macOS) — backend=${{ inputs.backend }}
        if: inputs.backend == 'postgres' && runner.os == 'macOS'
        # macos-14 runner pre-installs vary by image revision — the
        # @14 / @15 / @16 formula availability shifts. Probe what's
        # installed; install the latest non-deprecated otherwise.
        # Use a fallback chain so the harness keeps working as the
        # runner image rotates its pre-installed postgres version.
        run: |
          PG_FORMULA=""
          for f in postgresql@16 postgresql@15 postgresql@14 postgresql; do
            if brew list "$f" >/dev/null 2>&1; then
              PG_FORMULA="$f"
              echo "Found pre-installed: $f"
              break
            fi
          done
          if [ -z "$PG_FORMULA" ]; then
            echo "No pre-installed postgresql formula found; installing postgresql@16"
            brew install postgresql@16
            PG_FORMULA="postgresql@16"
          fi
          brew services start "$PG_FORMULA"
          # Wait for the server to accept connections (self-healing: up to ~60s
          # to absorb a cold formula install / slow service start).
          ready=""
          for i in $(seq 1 30); do
            if pg_isready -h localhost >/dev/null 2>&1; then ready=1; echo "ready after ~$((i*2))s"; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then echo "::error::brew postgres did not become ready"; exit 1; fi
          # brew's postgres starts with the runner user as superuser,
          # NOT `postgres`. Create the postgres role + db to match the
          # CIRIS_CONFORMANCE_DATABASE_URL the harness expects.
          psql postgres -c "CREATE USER postgres WITH SUPERUSER PASSWORD 'postgres';" 2>/dev/null || \
            psql postgres -c "ALTER USER postgres PASSWORD 'postgres';"
          createdb -U postgres conformance 2>/dev/null || true
          # Smoke check
          PGPASSWORD=postgres psql -h localhost -U postgres -d conformance -c "SELECT version();"

      - name: install harness + dev tooling
        working-directory: conformance
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: install pinned siblings from matrices/current.yaml
        working-directory: conformance
        run: |
          python -c "
          import yaml, subprocess, sys
          matrix = yaml.safe_load(open('matrices/current.yaml'))
          pins = matrix['stack']
          under_test = '${{ inputs.under-test-package }}'.replace('-', '_')
          install_args = [
              f'{pkg}=={ver}'
              for pkg, ver in pins.items()
              if pkg.replace('-', '_') != under_test
          ]
          print(f'Installing pinned siblings: {install_args}')
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *install_args])
          "

      - name: download under-test wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.under-test-wheel-artifact }}
          path: under-test-wheel

      - name: install under-test wheel (force-reinstall)
        run: |
          WHEEL=$(ls under-test-wheel/*.whl | head -1)
          if [ -z "$WHEEL" ]; then
            echo "::error::No .whl file found in artifact ${{ inputs.under-test-wheel-artifact }}"
            ls -la under-test-wheel/
            exit 1
          fi
          echo "Installing under-test wheel: $WHEEL"
          pip install --force-reinstall --no-deps "$WHEEL"
          pip show "${{ inputs.under-test-package }}"

      - name: run conformance suite against (${{ inputs.runs-on }} × ${{ inputs.backend }})
        working-directory: conformance
        run: |
          echo "::group::Environment"
          echo "runs-on:  ${{ inputs.runs-on }}"
          echo "backend:  ${{ inputs.backend }}"
          echo "url:      ${CIRIS_CONFORMANCE_DATABASE_URL}"
          echo "python:   $(python --version)"
          echo "::endgroup::"
          pytest -v --tb=short
