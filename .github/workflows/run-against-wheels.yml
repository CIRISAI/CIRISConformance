name: run-against-wheels

# Reusable workflow invoked from sibling CIRIS repos. Lets each repo's
# tag-run verify cohabitation against its just-built artifact + the
# rest of the pinned stack BEFORE that artifact ships to PyPI.
#
# Example usage from CIRISEdge/.github/workflows/ci.yml:
#
#   jobs:
#     conformance:
#       needs: [pyo3-wheel]
#       uses: CIRISAI/CIRISConformance/.github/workflows/run-against-wheels.yml@main
#       with:
#         under-test-wheel-artifact: ciris_edge-wheel-linux-x86_64
#         under-test-package: ciris-edge
#         matrix-ref: main
#
# Semantics:
#   1. Clone CIRISConformance at `matrix-ref`
#   2. Install the pinned siblings from matrices/current.yaml
#   3. Download the under-test wheel artifact from the caller's run
#   4. pip install --force-reinstall that artifact (overrides any pin)
#   5. Run the conformance suite
#
# A failure here in the caller's tag-run BLOCKS publish-pypi — the
# under-test artifact failed its cohabitation contract.

on:
  workflow_call:
    inputs:
      under-test-wheel-artifact:
        description: "actions/upload-artifact name carrying the wheel under test"
        required: true
        type: string
      under-test-package:
        description: "PyPI package name (e.g. ciris-edge) — used to override the pinned version"
        required: true
        type: string
      matrix-ref:
        description: "git ref of CIRISConformance to run against"
        required: false
        type: string
        default: "main"
      python-version:
        description: "Python interpreter version"
        required: false
        type: string
        default: "3.12"

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: clone CIRISConformance @ ${{ inputs.matrix-ref }}
        uses: actions/checkout@v4
        with:
          repository: CIRISAI/CIRISConformance
          ref: ${{ inputs.matrix-ref }}
          path: conformance

      - name: set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: install harness + dev tooling
        working-directory: conformance
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: install pinned siblings from matrices/current.yaml
        working-directory: conformance
        run: |
          python -c "
          import yaml, subprocess, sys
          matrix = yaml.safe_load(open('matrices/current.yaml'))
          pins = matrix['stack']
          # Skip the under-test package — we install the just-built
          # wheel of it next, with --force-reinstall so it overrides
          # any pin pip resolved via transitives.
          under_test = '${{ inputs.under-test-package }}'.replace('-', '_')
          install_args = [
              f'{pkg}=={ver}'
              for pkg, ver in pins.items()
              if pkg.replace('-', '_') != under_test
          ]
          print(f'Installing pinned siblings: {install_args}')
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *install_args])
          "

      - name: download under-test wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.under-test-wheel-artifact }}
          path: under-test-wheel

      - name: install under-test wheel (force-reinstall)
        run: |
          WHEEL=$(ls under-test-wheel/*.whl | head -1)
          if [ -z "$WHEEL" ]; then
            echo "::error::No .whl file found in artifact ${{ inputs.under-test-wheel-artifact }}"
            ls -la under-test-wheel/
            exit 1
          fi
          echo "Installing under-test wheel: $WHEEL"
          pip install --force-reinstall --no-deps "$WHEEL"
          pip show "${{ inputs.under-test-package }}"

      - name: run conformance suite against the under-test artifact
        working-directory: conformance
        run: pytest -v --tb=short
